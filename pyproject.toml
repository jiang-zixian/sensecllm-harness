[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensecllm-harness"
version = "0.1.0"
description = "Physics-constrained multi-agent harness for sensor security analysis"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
legacy = ["PyMuPDF>=1.24", "pdfplumber>=0.11", "pypdf>=5", "PyPDF2>=3"]
rag = ["lancedb>=0.17", "openai>=1.50"]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.13", "fastapi>=0.115,<1"]

[project.scripts]
sensecllm = "sensecllm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sensecllm*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
