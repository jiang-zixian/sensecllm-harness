name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/sensecllm tests helpers/configs/configs.py scripts
      - run: mypy src/sensecllm --ignore-missing-imports --no-strict-optional
      - run: pytest -q
      - run: python scripts/check_secrets.py
